name: Check 3D Modeler

on:
  push:
    paths:
      - 'modeler.html'
      - 'modeler.css'
      - 'modeler/**'
      - '.github/tests/modeler-smoke.mjs'
      - '.github/workflows/modeler-check.yml'
  pull_request:
    paths:
      - 'modeler.html'
      - 'modeler.css'
      - 'modeler/**'
      - '.github/tests/modeler-smoke.mjs'
      - '.github/workflows/modeler-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for f in modeler/*.js .github/tests/*.mjs; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: |
          python3 -m http.server 4173 >/tmp/modeler-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node .github/tests/modeler-smoke.mjs
