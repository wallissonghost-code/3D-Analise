name: Deploy 3D Analise + 2D Rig Lab Web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 755 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 "$HOME/.local/bin/godot"
          curl -L --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          "$HOME/.local/bin/godot" --version

      - name: Export 2D Rig Lab Web
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p web-build/2d-rig-lab
          cd 2D-Rig-Lab
          "$HOME/.local/bin/godot" --headless --editor --quit --path .
          "$HOME/.local/bin/godot" --headless --path . --export-release "Web" ../web-build/2d-rig-lab/index.html
          test -f ../web-build/2d-rig-lab/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
